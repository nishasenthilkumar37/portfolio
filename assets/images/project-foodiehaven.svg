<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="foodie-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#foodie-bg)" opacity="0.95"/>
  <g transform="translate(60, 45)">
    <!-- App Window -->
    <rect width="680" height="410" rx="12" fill="#18181b" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
    <!-- Top Nav -->
    <circle cx="25" cy="22" r="5" fill="#ef4444"/>
    <circle cx="42" cy="22" r="5" fill="#eab308"/>
    <circle cx="59" cy="22" r="5" fill="#22c55e"/>
    <!-- Search Bar -->
    <rect x="200" y="12" width="280" height="22" rx="11" fill="#27272a"/>
    <text x="340" y="27" fill="#a1a1aa" font-size="10" font-family="sans-serif" text-anchor="middle">🔍 Search artisan recipes, ingredients...</text>
    
    <!-- Hero Banner inside app -->
    <g transform="translate(25, 50)">
      <rect width="630" height="100" rx="8" fill="#27272a"/>
      <rect x="20" y="20" width="140" height="14" rx="4" fill="#fb923c"/>
      <rect x="20" y="42" width="280" height="8" rx="4" fill="#71717a"/>
      <rect x="20" y="56" width="220" height="8" rx="4" fill="#71717a"/>
      <rect x="20" y="72" width="90" height="20" rx="6" fill="#ea580c"/>
      <text x="65" y="86" fill="#ffffff" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">Trending Now</text>
      <!-- Hero Image Placeholder -->
      <circle cx="550" cy="50" r="35" fill="#f97316" fill-opacity="0.3"/>
      <circle cx="550" cy="50" r="25" fill="#f97316"/>
    </g>

    <!-- Recipe Grid -->
    <!-- Card 1 -->
    <g transform="translate(25, 165)">
      <rect width="195" height="225" rx="8" fill="#27272a"/>
      <rect x="15" y="15" width="165" height="100" rx="6" fill="#3f3f46"/>
      <circle cx="97" cy="65" r="28" fill="#fb923c" fill-opacity="0.4"/>
      <rect x="15" y="125" width="120" height="10" rx="4" fill="#f4f4f5"/>
      <rect x="15" y="142" width="80" height="7" rx="3" fill="#a1a1aa"/>
      <rect x="15" y="165" width="60" height="18" rx="4" fill="#10b981" fill-opacity="0.2"/>
      <text x="45" y="177" fill="#34d399" font-size="9" font-family="sans-serif" text-anchor="middle">⚡ 25 Mins</text>
      <rect x="15" y="192" width="165" height="22" rx="5" fill="#ea580c"/>
      <text x="97" y="206" fill="#ffffff" font-size="9" font-family="sans-serif" font-weight="600" text-anchor="middle">View Recipe</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(242, 165)">
      <rect width="195" height="225" rx="8" fill="#27272a"/>
      <rect x="15" y="15" width="165" height="100" rx="6" fill="#3f3f46"/>
      <circle cx="97" cy="65" r="28" fill="#ec4899" fill-opacity="0.4"/>
      <rect x="15" y="125" width="130" height="10" rx="4" fill="#f4f4f5"/>
      <rect x="15" y="142" width="90" height="7" rx="3" fill="#a1a1aa"/>
      <rect x="15" y="165" width="60" height="18" rx="4" fill="#6366f1" fill-opacity="0.2"/>
      <text x="45" y="177" fill="#818cf8" font-size="9" font-family="sans-serif" text-anchor="middle">🌱 Vegan</text>
      <rect x="15" y="192" width="165" height="22" rx="5" fill="#ea580c"/>
      <text x="97" y="206" fill="#ffffff" font-size="9" font-family="sans-serif" font-weight="600" text-anchor="middle">View Recipe</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(460, 165)">
      <rect width="195" height="225" rx="8" fill="#27272a"/>
      <rect x="15" y="15" width="165" height="100" rx="6" fill="#3f3f46"/>
      <circle cx="97" cy="65" r="28" fill="#eab308" fill-opacity="0.4"/>
      <rect x="15" y="125" width="110" height="10" rx="4" fill="#f4f4f5"/>
      <rect x="15" y="142" width="70" height="7" rx="3" fill="#a1a1aa"/>
      <rect x="15" y="165" width="60" height="18" rx="4" fill="#ef4444" fill-opacity="0.2"/>
      <text x="45" y="177" fill="#f87171" font-size="9" font-family="sans-serif" text-anchor="middle">🔥 Popular</text>
      <rect x="15" y="192" width="165" height="22" rx="5" fill="#ea580c"/>
      <text x="97" y="206" fill="#ffffff" font-size="9" font-family="sans-serif" font-weight="600" text-anchor="middle">View Recipe</text>
    </g>
  </g>
</svg>
