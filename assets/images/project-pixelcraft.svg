<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="pixel-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#pixel-bg)" opacity="0.95"/>
  <g transform="translate(60, 45)">
    <!-- App Window -->
    <rect width="680" height="410" rx="12" fill="#0f0728" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
    <circle cx="25" cy="22" r="5" fill="#ef4444"/>
    <circle cx="42" cy="22" r="5" fill="#eab308"/>
    <circle cx="59" cy="22" r="5" fill="#22c55e"/>

    <!-- Hero Header -->
    <g transform="translate(35, 60)">
      <text x="0" y="30" fill="#f43f5e" font-size="12" font-family="sans-serif" font-weight="bold" letter-spacing="2">DIGITAL CREATIVE STUDIO</text>
      <text x="0" y="70" fill="#ffffff" font-size="28" font-family="sans-serif" font-weight="900">Crafting Unforgettable</text>
      <text x="0" y="105" fill="#c084fc" font-size="28" font-family="sans-serif" font-weight="900">Interactive Experiences</text>
      
      <rect x="0" y="130" width="130" height="34" rx="8" fill="#ec4899"/>
      <text x="65" y="151" fill="#ffffff" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">View Showreel</text>
    </g>

    <!-- Floating 3D/Design cards -->
    <g transform="translate(380, 50)">
      <rect width="260" height="150" rx="12" fill="#1e1035" stroke="#a855f7" stroke-width="1.5"/>
      <circle cx="50" cy="50" r="25" fill="#f43f5e"/>
      <polygon points="120,30 160,80 80,80" fill="#a855f7" fill-opacity="0.8"/>
      <rect x="180" y="30" width="40" height="40" rx="6" fill="#3b82f6"/>
      <text x="20" y="120" fill="#f3e8ff" font-size="12" font-family="sans-serif" font-weight="bold">Brand Identity & 3D Web</text>
    </g>

    <!-- Gallery row -->
    <g transform="translate(35, 230)">
      <rect width="180" height="145" rx="8" fill="#1b1238"/>
      <circle cx="40" cy="40" r="14" fill="#38bdf8"/>
      <text x="20" y="85" fill="#e9d5ff" font-size="11" font-family="sans-serif" font-weight="bold">Typography & Motion</text>
      <text x="20" y="110" fill="#a855f7" font-size="9" font-family="sans-serif">CSS Canvas & SVG</text>

      <rect x="210" y="0" width="180" height="145" rx="8" fill="#1b1238"/>
      <circle cx="250" cy="40" r="14" fill="#ec4899"/>
      <text x="230" y="85" fill="#e9d5ff" font-size="11" font-family="sans-serif" font-weight="bold">Design Systems</text>
      <text x="230" y="110" fill="#ec4899" font-size="9" font-family="sans-serif">Figma to HTML/CSS</text>

      <rect x="420" y="0" width="190" height="145" rx="8" fill="#1b1238"/>
      <circle cx="460" cy="40" r="14" fill="#10b981"/>
      <text x="440" y="85" fill="#e9d5ff" font-size="11" font-family="sans-serif" font-weight="bold">Micro-Interactions</text>
      <text x="440" y="110" fill="#10b981" font-size="9" font-family="sans-serif">60fps Transitions</text>
    </g>
  </g>
</svg>
