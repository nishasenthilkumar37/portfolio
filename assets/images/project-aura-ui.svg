<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="aura-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="aura-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#aura-bg)" opacity="0.95"/>
  <g transform="translate(60, 50)">
    <!-- Window Frame -->
    <rect width="680" height="400" rx="12" fill="#0f172a" fill-opacity="0.9" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
    <!-- Top Bar -->
    <circle cx="25" cy="22" r="5" fill="#ef4444"/>
    <circle cx="42" cy="22" r="5" fill="#eab308"/>
    <circle cx="59" cy="22" r="5" fill="#22c55e"/>
    <rect x="180" y="14" width="320" height="16" rx="8" fill="#1e293b"/>
    <text x="340" y="26" fill="#94a3b8" font-size="10" font-family="sans-serif" text-anchor="middle">auraui.design/components</text>
    
    <!-- Sidebar -->
    <rect x="0" y="44" width="160" height="356" fill="#1e293b" fill-opacity="0.5"/>
    <rect x="20" y="65" width="100" height="10" rx="5" fill="#6366f1"/>
    <rect x="20" y="90" width="80" height="8" rx="4" fill="#475569"/>
    <rect x="20" y="110" width="95" height="8" rx="4" fill="#475569"/>
    <rect x="20" y="130" width="70" height="8" rx="4" fill="#475569"/>
    <rect x="20" y="150" width="85" height="8" rx="4" fill="#475569"/>

    <!-- Component Cards -->
    <!-- Card 1: Buttons -->
    <g transform="translate(185, 65)">
      <rect width="220" height="150" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.05)"/>
      <text x="15" y="25" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="bold">Buttons & Badges</text>
      <!-- Button Elements -->
      <rect x="15" y="45" width="85" height="28" rx="6" fill="#6366f1"/>
      <text x="57" y="63" fill="#ffffff" font-size="10" font-family="sans-serif" font-weight="600" text-anchor="middle">Primary</text>
      <rect x="110" y="45" width="90" height="28" rx="6" fill="transparent" stroke="#6366f1" stroke-width="1.5"/>
      <text x="155" y="63" fill="#a5b4fc" font-size="10" font-family="sans-serif" font-weight="600" text-anchor="middle">Secondary</text>
      <!-- Badges -->
      <rect x="15" y="90" width="55" height="20" rx="10" fill="#10b981" fill-opacity="0.2"/>
      <text x="42" y="104" fill="#34d399" font-size="9" font-family="sans-serif" text-anchor="middle">Active</text>
      <rect x="80" y="90" width="65" height="20" rx="10" fill="#f59e0b" fill-opacity="0.2"/>
      <text x="112" y="104" fill="#fbbf24" font-size="9" font-family="sans-serif" text-anchor="middle">Pending</text>
    </g>

    <!-- Card 2: Interactive Card -->
    <g transform="translate(430, 65)">
      <rect width="225" height="150" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.05)"/>
      <circle cx="35" cy="40" r="16" fill="#38bdf8"/>
      <rect x="65" y="30" width="90" height="10" rx="5" fill="#f1f5f9"/>
      <rect x="65" y="46" width="60" height="6" rx="3" fill="#64748b"/>
      <rect x="20" y="75" width="185" height="8" rx="4" fill="#334155"/>
      <rect x="20" y="92" width="150" height="8" rx="4" fill="#334155"/>
      <rect x="20" y="115" width="80" height="22" rx="6" fill="#06b6d4"/>
      <text x="60" y="130" fill="#ffffff" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">Explore</text>
    </g>

    <!-- Bottom Showcase -->
    <g transform="translate(185, 235)">
      <rect width="470" height="145" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.05)"/>
      <text x="20" y="25" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="bold">Color Palette Tokens & Accessibility (WCAG AAA)</text>
      <g transform="translate(20, 45)">
        <rect x="0" y="0" width="70" height="40" rx="6" fill="#6366f1"/>
        <text x="35" y="60" fill="#94a3b8" font-size="9" font-family="sans-serif" text-anchor="middle">Primary</text>
        <rect x="85" y="0" width="70" height="40" rx="6" fill="#06b6d4"/>
        <text x="120" y="60" fill="#94a3b8" font-size="9" font-family="sans-serif" text-anchor="middle">Accent</text>
        <rect x="170" y="0" width="70" height="40" rx="6" fill="#10b981"/>
        <text x="205" y="60" fill="#94a3b8" font-size="9" font-family="sans-serif" text-anchor="middle">Success</text>
        <rect x="255" y="0" width="70" height="40" rx="6" fill="#f59e0b"/>
        <text x="290" y="60" fill="#94a3b8" font-size="9" font-family="sans-serif" text-anchor="middle">Warning</text>
        <rect x="340" y="0" width="70" height="40" rx="6" fill="#ef4444"/>
        <text x="375" y="60" fill="#94a3b8" font-size="9" font-family="sans-serif" text-anchor="middle">Danger</text>
      </g>
    </g>
  </g>
</svg>
