<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#cs-bg)"/>

  <g transform="translate(60, 40)">
    <rect width="680" height="420" rx="14" fill="#041f1a" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    <!-- Controls -->
    <circle cx="25" cy="22" r="5" fill="#ef4444"/>
    <circle cx="42" cy="22" r="5" fill="#eab308"/>
    <circle cx="59" cy="22" r="5" fill="#22c55e"/>
    <text x="340" y="26" fill="#5eead4" font-size="11" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" text-anchor="middle">Client-Server Distributed Architecture &amp; Network Protocols</text>

    <!-- Top Badge Banner -->
    <g transform="translate(30, 50)">
      <rect width="620" height="45" rx="8" fill="#0a3d34"/>
      <text x="20" y="28" fill="#99f6e4" font-size="12" font-family="sans-serif" font-weight="bold">🎓 Co-Curricular Technical Presentation &amp; System Architecture Model</text>
      <rect x="510" y="10" width="95" height="25" rx="4" fill="#14b8a6"/>
      <text x="557" y="27" fill="#042f2e" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">College Honor</text>
    </g>

    <!-- Diagram Architecture -->
    <!-- Client Nodes (Left) -->
    <g transform="translate(45, 120)">
      <rect width="160" height="75" rx="8" fill="#115e59" stroke="#2dd4bf" stroke-width="1.5"/>
      <text x="80" y="32" fill="#f0fdfa" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">💻 Web Client</text>
      <text x="80" y="52" fill="#ccfbf1" font-size="9" font-family="sans-serif" text-anchor="middle">HTML5 / JS / Browser</text>

      <rect y="100" width="160" height="75" rx="8" fill="#115e59" stroke="#2dd4bf" stroke-width="1.5"/>
      <text x="80" y="132" fill="#f0fdfa" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">📱 Mobile Client</text>
      <text x="80" y="152" fill="#ccfbf1" font-size="9" font-family="sans-serif" text-anchor="middle">Android / REST APIs</text>

      <rect y="200" width="160" height="75" rx="8" fill="#115e59" stroke="#2dd4bf" stroke-width="1.5"/>
      <text x="80" y="232" fill="#f0fdfa" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">🖥️ Desktop App</text>
      <text x="80" y="252" fill="#ccfbf1" font-size="9" font-family="sans-serif" text-anchor="middle">Java / Python Engine</text>
    </g>

    <!-- Network Protocols Hub (Center) -->
    <g transform="translate(260, 140)">
      <rect width="160" height="190" rx="12" fill="#0b2e28" stroke="#5eead4" stroke-width="2"/>
      <text x="80" y="30" fill="#2dd4bf" font-size="12" font-family="sans-serif" font-weight="900" text-anchor="middle">⚡ NETWORK HUB</text>
      <rect x="15" y="45" width="130" height="24" rx="4" fill="#134e4a"/>
      <text x="80" y="61" fill="#99f6e4" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">HTTP/HTTPS &amp; REST</text>

      <rect x="15" y="78" width="130" height="24" rx="4" fill="#134e4a"/>
      <text x="80" y="94" fill="#99f6e4" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">TCP/IP Socket Layer</text>

      <rect x="15" y="111" width="130" height="24" rx="4" fill="#134e4a"/>
      <text x="80" y="127" fill="#99f6e4" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">JSON Data Payloads</text>

      <rect x="15" y="144" width="130" height="24" rx="4" fill="#14b8a6"/>
      <text x="80" y="160" fill="#042f2e" font-size="9" font-family="sans-serif" font-weight="900" text-anchor="middle">SSL Handshake</text>
    </g>

    <!-- Server & Database (Right) -->
    <g transform="translate(475, 120)">
      <rect width="160" height="115" rx="8" fill="#115e59" stroke="#2dd4bf" stroke-width="1.5"/>
      <text x="80" y="35" fill="#f0fdfa" font-size="13" font-family="sans-serif" font-weight="bold" text-anchor="middle">🗄️ Application Server</text>
      <text x="80" y="60" fill="#ccfbf1" font-size="10" font-family="sans-serif" text-anchor="middle">Java / Python / Node</text>
      <text x="80" y="80" fill="#a7f3d0" font-size="9" font-family="sans-serif" text-anchor="middle">Business Logic Layer</text>

      <rect y="140" width="160" height="115" rx="8" fill="#0f766e" stroke="#2dd4bf" stroke-width="1.5"/>
      <text x="80" y="175" fill="#f0fdfa" font-size="13" font-family="sans-serif" font-weight="bold" text-anchor="middle">💾 SQL Database</text>
      <text x="80" y="200" fill="#ccfbf1" font-size="10" font-family="sans-serif" text-anchor="middle">Relational Schema</text>
      <text x="80" y="220" fill="#a7f3d0" font-size="9" font-family="sans-serif" text-anchor="middle">ACID Queries &amp; CRUD</text>
    </g>
  </g>
</svg>
