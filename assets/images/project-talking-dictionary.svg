<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="td-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="td-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#td-bg)"/>

  <!-- Main Window -->
  <g transform="translate(60, 40)">
    <rect width="680" height="420" rx="14" fill="#0b0f19" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    <!-- Controls -->
    <circle cx="25" cy="22" r="5" fill="#ef4444"/>
    <circle cx="42" cy="22" r="5" fill="#eab308"/>
    <circle cx="59" cy="22" r="5" fill="#22c55e"/>
    <text x="340" y="26" fill="#c084fc" font-size="11" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" text-anchor="middle">Talking Dictionary &amp; Thesaurus Engine (Voice Assisted)</text>

    <!-- Top Search & Voice Action Bar -->
    <g transform="translate(30, 50)">
      <rect width="620" height="56" rx="10" fill="#131b2e" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="25" y="34" fill="#94a3b8" font-size="14" font-family="sans-serif">🔍 Search word: <tspan fill="#f8fafc" font-weight="bold">"INNOVATION"</tspan></text>
      
      <!-- Audio / Speech Button (Highlighted) -->
      <g transform="translate(480, 10)">
        <rect width="125" height="36" rx="8" fill="#7c3aed" filter="url(#td-glow)"/>
        <text x="62" y="23" fill="#ffffff" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">🔊 Play Audio</text>
      </g>
    </g>

    <!-- Audio Waveform Visualization for Visually Impaired -->
    <g transform="translate(30, 120)">
      <rect width="620" height="60" rx="8" fill="#1a1333" stroke="rgba(217, 70, 239, 0.3)"/>
      <text x="20" y="35" fill="#e879f9" font-size="11" font-family="sans-serif" font-weight="bold">Voice Waveform Synthesis:</text>
      
      <!-- Waveform Bars -->
      <g transform="translate(200, 12)">
        <rect x="0" y="10" width="6" height="16" rx="3" fill="#a855f7"/>
        <rect x="12" y="4" width="6" height="28" rx="3" fill="#c084fc"/>
        <rect x="24" y="0" width="6" height="36" rx="3" fill="#e879f9"/>
        <rect x="36" y="6" width="6" height="24" rx="3" fill="#a855f7"/>
        <rect x="48" y="12" width="6" height="12" rx="3" fill="#8b5cf6"/>
        <rect x="60" y="2" width="6" height="32" rx="3" fill="#e879f9"/>
        <rect x="72" y="8" width="6" height="20" rx="3" fill="#c084fc"/>
        <rect x="84" y="0" width="6" height="36" rx="3" fill="#f472b6"/>
        <rect x="96" y="5" width="6" height="26" rx="3" fill="#a855f7"/>
        <rect x="108" y="10" width="6" height="16" rx="3" fill="#8b5cf6"/>
        <rect x="120" y="2" width="6" height="32" rx="3" fill="#e879f9"/>
        <rect x="132" y="12" width="6" height="12" rx="3" fill="#c084fc"/>
        <rect x="144" y="0" width="6" height="36" rx="3" fill="#f472b6"/>
        <rect x="156" y="7" width="6" height="22" rx="3" fill="#8b5cf6"/>
      </g>
      <rect x="500" y="18" width="100" height="24" rx="12" fill="#10b981" fill-opacity="0.2"/>
      <text x="550" y="34" fill="#34d399" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">♿ a11y Voice Note</text>
    </g>

    <!-- Definition & Thesaurus Grid -->
    <!-- Synonyms Box -->
    <g transform="translate(30, 195)">
      <rect width="295" height="200" rx="8" fill="#131b2e"/>
      <text x="20" y="30" fill="#38bdf8" font-size="13" font-family="sans-serif" font-weight="bold">📖 Synonyms (Quick Recall)</text>
      
      <rect x="20" y="50" width="120" height="28" rx="6" fill="#1e293b"/>
      <text x="80" y="68" fill="#f8fafc" font-size="11" font-family="sans-serif" text-anchor="middle">✦ Breakthrough</text>

      <rect x="150" y="50" width="120" height="28" rx="6" fill="#1e293b"/>
      <text x="210" y="68" fill="#f8fafc" font-size="11" font-family="sans-serif" text-anchor="middle">✦ Modernization</text>

      <rect x="20" y="90" width="120" height="28" rx="6" fill="#1e293b"/>
      <text x="80" y="108" fill="#f8fafc" font-size="11" font-family="sans-serif" text-anchor="middle">✦ Novelty</text>

      <rect x="150" y="90" width="120" height="28" rx="6" fill="#1e293b"/>
      <text x="210" y="108" fill="#f8fafc" font-size="11" font-family="sans-serif" text-anchor="middle">✦ Advancement</text>

      <text x="20" y="150" fill="#94a3b8" font-size="11" font-family="sans-serif">Assists students &amp; professionals in one click.</text>
      <rect x="20" y="165" width="160" height="20" rx="4" fill="#8b5cf6" fill-opacity="0.2"/>
      <text x="100" y="179" fill="#c084fc" font-size="9" font-family="sans-serif" text-anchor="middle">Zero Memory Strain</text>
    </g>

    <!-- Antonyms & Thesaurus Box -->
    <g transform="translate(355, 195)">
      <rect width="295" height="200" rx="8" fill="#131b2e"/>
      <text x="20" y="30" fill="#f43f5e" font-size="13" font-family="sans-serif" font-weight="bold">🔄 Antonyms &amp; Context</text>

      <rect x="20" y="50" width="120" height="28" rx="6" fill="#1e293b"/>
      <text x="80" y="68" fill="#fca5a5" font-size="11" font-family="sans-serif" text-anchor="middle">✕ Stagnation</text>

      <rect x="150" y="50" width="120" height="28" rx="6" fill="#1e293b"/>
      <text x="210" y="68" fill="#fca5a5" font-size="11" font-family="sans-serif" text-anchor="middle">✕ Traditionalism</text>

      <rect x="20" y="90" width="120" height="28" rx="6" fill="#1e293b"/>
      <text x="80" y="108" fill="#fca5a5" font-size="11" font-family="sans-serif" text-anchor="middle">✕ Regression</text>

      <rect x="150" y="90" width="120" height="28" rx="6" fill="#1e293b"/>
      <text x="210" y="108" fill="#fca5a5" font-size="11" font-family="sans-serif" text-anchor="middle">✕ Obsolescence</text>

      <text x="20" y="150" fill="#94a3b8" font-size="11" font-family="sans-serif">Voice note playback for accessibility.</text>
      <rect x="20" y="165" width="170" height="20" rx="4" fill="#06b6d4" fill-opacity="0.2"/>
      <text x="105" y="179" fill="#38bdf8" font-size="9" font-family="sans-serif" text-anchor="middle">Python / Java Architecture</text>
    </g>
  </g>
</svg>
