<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Vibrant Glowing Gradients -->
    <linearGradient id="nisha-aura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#ec4899;#06b6d4;#8b5cf6" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#d946ef">
        <animate attributeName="stop-color" values="#d946ef;#3b82f6;#10b981;#d946ef" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6;#8b5cf6;#ec4899;#3b82f6" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="hair-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090514" />
    </linearGradient>

    <linearGradient id="skin-tone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="suit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <filter id="glow-filter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="badge-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Ambient Pulsing Glow Circle -->
  <circle cx="250" cy="250" r="210" fill="url(#nisha-aura)" opacity="0.4" filter="url(#glow-filter)">
    <animate attributeName="r" values="200;225;200" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite" />
  </circle>

  <!-- Inner Dark Aesthetic Background Frame -->
  <circle cx="250" cy="250" r="195" fill="#090d16" stroke="url(#nisha-aura)" stroke-width="4" />

  <!-- Animated Tech Geometry / Grid Rings in Background -->
  <g opacity="0.25" stroke="#a855f7" stroke-width="1.5" fill="none" stroke-dasharray="6,6">
    <circle cx="250" cy="250" r="170">
      <animateTransform attributeName="transform" type="rotate" from="0 250 250" to="360 250 250" dur="40s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="250" r="140">
      <animateTransform attributeName="transform" type="rotate" from="360 250 250" to="0 250 250" dur="30s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Animated Sparkles & Floating Particles -->
  <g fill="#ec4899">
    <circle cx="100" cy="140" r="3">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="cy" values="140;130;140" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="390" cy="130" r="4" fill="#06b6d4">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite" />
      <animate attributeName="cy" values="130;118;130" dur="3.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="380" cy="340" r="3.5" fill="#f59e0b">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="110" cy="330" r="3" fill="#a855f7">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Character Group with Subtle Breathing Animation -->
  <g id="nisha-character">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-6; 0,0" dur="4s" repeatCount="indefinite" ease="easeInOut" />

    <!-- Long Graceful Hair Backing -->
    <path d="M 160 170 C 140 230 135 340 170 390 C 180 340 185 270 190 220 Z" fill="url(#hair-grad)" />
    <path d="M 340 170 C 360 230 365 340 330 390 C 320 340 315 270 310 220 Z" fill="url(#hair-grad)" />

    <!-- Professional Blazer / Outfit (MBA + Tech Executive) -->
    <path d="M 130 440 C 145 350 180 320 250 320 C 320 320 355 350 370 440 Z" fill="url(#suit-grad)" />
    <!-- Lapels & Inner Blouse -->
    <path d="M 210 325 L 250 380 L 290 325 Z" fill="#312e81" />
    <path d="M 225 325 L 250 365 L 275 325 Z" fill="#ffffff" />
    <!-- Smart Accent Collar Pin / Badge -->
    <circle cx="215" cy="355" r="4" fill="#fbbf24" />

    <!-- Elegant Neck -->
    <path d="M 225 270 L 225 330 C 235 335 265 335 275 330 L 275 270 Z" fill="url(#skin-tone)" />

    <!-- Face Silhouette -->
    <path d="M 185 180 C 185 130 315 130 315 180 C 315 240 285 285 250 285 C 215 285 185 240 185 180 Z" fill="url(#skin-tone)" />

    <!-- Expressive Modern Hair Front & Curls -->
    <path d="M 180 175 C 175 115 210 85 250 85 C 295 85 325 115 320 175 C 300 130 270 120 250 120 C 220 120 195 135 180 175 Z" fill="url(#hair-grad)" />
    <path d="M 180 160 C 185 125 220 100 250 100 C 280 100 310 120 320 155 C 305 135 275 125 245 130 C 215 135 195 150 180 160 Z" fill="#312e81" opacity="0.6"/>

    <!-- Stylish Modern Glasses (Teal/Cyan Tech Frames) -->
    <!-- Left Frame -->
    <rect x="195" y="175" width="45" height="34" rx="10" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4" stroke-width="3.5"/>
    <!-- Right Frame -->
    <rect x="260" y="175" width="45" height="34" rx="10" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4" stroke-width="3.5"/>
    <!-- Bridge -->
    <path d="M 240 188 Q 250 182 260 188" fill="none" stroke="#06b6d4" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Lens Light Reflection (Animated) -->
    <line x1="202" y1="182" x2="225" y2="200" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite" />
    </line>
    <line x1="267" y1="182" x2="290" y2="200" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite" />
    </line>

    <!-- Eyes (Friendly & Confident) -->
    <ellipse cx="217" cy="192" rx="4.5" ry="5.5" fill="#0f172a"/>
    <circle cx="219" cy="190" r="1.8" fill="#ffffff"/>
    <ellipse cx="283" cy="192" rx="4.5" ry="5.5" fill="#0f172a"/>
    <circle cx="285" cy="190" r="1.8" fill="#ffffff"/>

    <!-- Subtle Eyebrows -->
    <path d="M 200 166 Q 217 160 235 168" fill="none" stroke="#1e1b4b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 265 168 Q 283 160 300 166" fill="none" stroke="#1e1b4b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Warm Confident Smile -->
    <path d="M 232 238 Q 250 252 268 238" fill="none" stroke="#b45309" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 235 240 Q 250 249 265 240" fill="#fca5a5" opacity="0.4"/>
    
    <!-- Delicate Traditional Bindi Accent (Elegance) -->
    <circle cx="250" cy="165" r="2.5" fill="#ef4444" />
  </g>

  <!-- Interactive Floating Skill Badges Around Avatar -->
  <!-- 1. MBA / Business Analytics Badge (Top Right) -->
  <g transform="translate(340, 75)" filter="url(#badge-shadow)">
    <animateTransform attributeName="transform" type="translate" values="340,75; 340,65; 340,75" dur="3.5s" repeatCount="indefinite" />
    <rect width="125" height="34" rx="17" fill="#0f172a" stroke="#ec4899" stroke-width="2"/>
    <text x="62" y="22" fill="#f472b6" font-size="12" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" text-anchor="middle">🎓 MBA Leader</text>
  </g>

  <!-- 2. Python / Data Dev Badge (Top Left) -->
  <g transform="translate(30, 85)" filter="url(#badge-shadow)">
    <animateTransform attributeName="transform" type="translate" values="30,85; 30,95; 30,85" dur="4.2s" repeatCount="indefinite" />
    <rect width="115" height="34" rx="17" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
    <text x="57" y="22" fill="#38bdf8" font-size="12" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" text-anchor="middle">🐍 Python / SQL</text>
  </g>

  <!-- 3. Web & UI/UX Developer (Bottom Left) -->
  <g transform="translate(25, 375)" filter="url(#badge-shadow)">
    <animateTransform attributeName="transform" type="translate" values="25,375; 25,365; 25,375" dur="3.8s" repeatCount="indefinite" />
    <rect width="125" height="34" rx="17" fill="#0f172a" stroke="#8b5cf6" stroke-width="2"/>
    <text x="62" y="22" fill="#c084fc" font-size="12" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" text-anchor="middle">⚡ Web Dev / UI</text>
  </g>

  <!-- 4. Java & Android (Bottom Right) -->
  <g transform="translate(345, 375)" filter="url(#badge-shadow)">
    <animateTransform attributeName="transform" type="translate" values="345,375; 345,385; 345,375" dur="4.5s" repeatCount="indefinite" />
    <rect width="120" height="34" rx="17" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <text x="60" y="22" fill="#34d399" font-size="12" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" text-anchor="middle">☕ Java & Apps</text>
  </g>

  <!-- Bottom Floating Status Chip -->
  <g transform="translate(170, 445)" filter="url(#badge-shadow)">
    <rect width="160" height="32" rx="16" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="20" cy="16" r="4.5" fill="#10b981">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="90" y="21" fill="#fde68a" font-size="11" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" text-anchor="middle">BSc IT • Ooty, India</text>
  </g>
</svg>
