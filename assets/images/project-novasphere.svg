<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="nova-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#nova-bg)" opacity="0.95"/>
  <g transform="translate(60, 45)">
    <!-- Browser Frame -->
    <rect width="680" height="410" rx="12" fill="#030712" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
    <circle cx="25" cy="22" r="5" fill="#ef4444"/>
    <circle cx="42" cy="22" r="5" fill="#eab308"/>
    <circle cx="59" cy="22" r="5" fill="#22c55e"/>
    
    <!-- Hero Section -->
    <g transform="translate(40, 60)">
      <rect x="0" y="0" width="120" height="24" rx="12" fill="#4f46e5" fill-opacity="0.3"/>
      <text x="60" y="16" fill="#818cf8" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">✨ Next-Gen AI Analytics</text>
      
      <text x="0" y="60" fill="#ffffff" font-size="24" font-family="sans-serif" font-weight="bold">Supercharge Your SaaS</text>
      <text x="0" y="90" fill="#ffffff" font-size="24" font-family="sans-serif" font-weight="bold">Conversion Funnels</text>
      
      <rect x="0" y="110" width="280" height="8" rx="4" fill="#6b7280"/>
      <rect x="0" y="125" width="220" height="8" rx="4" fill="#6b7280"/>

      <rect x="0" y="150" width="120" height="34" rx="8" fill="#6366f1"/>
      <text x="60" y="171" fill="#ffffff" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">Start Free Trial</text>

      <rect x="135" y="150" width="120" height="34" rx="8" fill="transparent" stroke="#4b5563" stroke-width="1.5"/>
      <text x="195" y="171" fill="#e5e7eb" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">Watch Demo ▷</text>
    </g>

    <!-- Isometric/3D Glass Card Graphic on right -->
    <g transform="translate(360, 60)">
      <rect width="280" height="280" rx="16" fill="#111827" stroke="rgba(99,102,241,0.3)" stroke-width="2"/>
      <!-- Chart lines -->
      <path d="M 20 220 L 70 180 L 120 200 L 180 120 L 230 140 L 260 70" fill="none" stroke="#6366f1" stroke-width="4" stroke-linecap="round"/>
      <path d="M 20 220 L 70 180 L 120 200 L 180 120 L 230 140 L 260 70 L 260 250 L 20 250 Z" fill="#6366f1" fill-opacity="0.1"/>
      <!-- Metric Float Card -->
      <g transform="translate(20, 20)">
        <rect width="130" height="60" rx="8" fill="#1f2937" stroke="rgba(255,255,255,0.1)"/>
        <text x="12" y="24" fill="#9ca3af" font-size="9" font-family="sans-serif">Total Revenue</text>
        <text x="12" y="46" fill="#10b981" font-size="16" font-family="sans-serif" font-weight="bold">+148.5%</text>
      </g>
    </g>
  </g>
</svg>
